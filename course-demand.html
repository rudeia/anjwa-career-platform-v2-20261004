<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>선택과목 신청서</title><link rel="stylesheet" href="./demand.css"></head><body><header><div><a href="./index.html#home">안좌고 교육과정 도우미</a><h1>선택과목 신청서</h1></div><a href="./index.html#planner">과목 설계로</a></header><main><p>다음 학년의 두 학기 희망 과목을 정리합니다. 엑셀을 학교가 안내한 방법으로 전달해야 접수됩니다. 수강 확정은 별도 안내합니다.</p><section class="panel config"><label>입학생<select id="demandPlan"></select></label><label>신청 대상 학년<select id="demandGrade"><option value="2">2학년</option><option value="3">3학년</option></select></label><label>조사 차수<input id="demandRound" value="1" maxlength="20" required></label><p id="demandContext"></p></section><section class="panel identity"><label>학번<input id="demandNumber" inputmode="numeric" autocomplete="off" maxlength="12" placeholder="예: 10101"></label><label>이름<input id="demandName" autocomplete="off" maxlength="40"></label><label>응답 상태<select id="demandStatus"><option value="active">신청 희망</option><option value="withdrawn">기존 희망 철회</option></select></label></section><div class="actions"><button id="importPlanner">내 과목 계획 가져오기</button><label class="file-button">기존 신청 엑셀 불러오기<input id="studentFile" type="file" accept=".xlsx"></label><button id="finishDemand">작성 마치기 · 입력 지우기</button></div><p>가져온 계획도 선택군과 참여 조건을 다시 확인합니다. 이름과 신청 내용은 이 화면을 나가면 자동 저장되지 않습니다. 엑셀을 직접 고치지 말고 이 화면에서 기존 신청 엑셀을 불러와 수정한 뒤 다시 내려받으세요.</p><div id="demandGroups"></div><p id="demandMessage" role="status" aria-live="polite"></p><div class="actions"><button class="primary" id="studentXlsx">신청 엑셀 내려받기</button><button id="studentPdf">한 페이지 PDF / 인쇄</button></div><section class="panel" id="applicationPreview" aria-label="신청서 미리보기"></section></main><script src="./curriculum-data.js"></script><script src="./student-data-model.js"></script><script src="./vendor/xlsx.full.min.js"></script><script src="./demand-core.js"></script><script src="./demand-files.js"></script><script src="./demand-ui.js"></script></body></html>

<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>학생 상담카드 | 교사 상담용</title>
    <link rel="stylesheet" href="./teacher-student-card.css?v=20260730a">
    <link rel="stylesheet" href="./ui-v2.css?v=2.02.03" />
  </head>
  <body>
    <main class="viewer-shell">
      <header class="viewer-head">
        <div>
          <p class="eyebrow">교사 상담용 · 읽기 전용</p>
          <h1 id="studentTitle">학생 상담카드</h1>
          <p id="studentMeta">학생 자료를 불러오는 중입니다.</p>
        </div>
        <div class="head-actions">
          <button id="exportStudentJson" class="secondary-button" type="button" disabled>교사 피드백</button>
          <button id="printStudentCard" class="secondary-button" type="button" disabled>A4 PDF</button>
          <button id="backDashboard" class="primary-button" type="button">대시보드로</button>
        </div>
      </header>

      <section class="source-note">
        <strong>일반 상담카드 저장소와 분리된 교사용 조회 화면입니다.</strong>
        <span>이 화면은 교사용 대시보드에 불러온 학생 파일만 읽으며, 이 PC에서 별도로 작성한 상담카드는 사용하지 않습니다.</span>
      </section>

      <nav class="view-switch" aria-label="상담카드 보기 방식">
        <button id="showTeacherView" class="is-active" type="button">교사 확인본</button>
        <button id="showStudentSource" type="button">학생 제출 원본</button>
      </nav>

      <section id="cardStatus" class="card-status" aria-live="polite"></section>
      <section id="cardContent" class="card-content" hidden>
        <div class="card-summary">
          <div><span>반</span><strong id="className">-</strong></div>
          <div><span>학번</span><strong id="studentNumber">-</strong></div>
          <div><span>지원안</span><strong id="planCount">0개</strong></div>
          <div><span>교사 수정</span><strong id="teacherEditCount">0건</strong></div>
        </div>

        <section id="studentGradeRecords" class="student-grade-records" aria-labelledby="studentGradesTitle">
          <div class="section-head">
            <div><span>학생 입력</span><h2 id="studentGradesTitle">학생부 과목별 성적</h2></div>
          </div>
          <div id="studentGradeRecordBody"></div>
        </section>

        <section aria-labelledby="plansTitle">
          <div class="section-head">
            <div><span>지원 현황</span><h2 id="plansTitle">수시 지원 상담카드</h2></div>
            <span id="viewLabel" class="source-badge source-teacher">교사 확인본</span>
          </div>
          <div id="planList" class="plan-list"></div>
        </section>

        <section class="opinion-panel" aria-labelledby="opinionTitle">
          <h2 id="opinionTitle">상담 의견</h2>
          <p id="overallOpinion">작성된 의견이 없습니다.</p>
        </section>

        <section class="revision-panel" aria-labelledby="revisionTitle">
          <h2 id="revisionTitle">교사 확인 이력</h2>
          <div id="revisionList"></div>
        </section>
      </section>
    </main>

    <script src="./admission-grade-calculators.js?v=20260729c" defer></script>
    <script src="./susi-card-transfer.js?v=20260730c" defer></script>
    <script src="./teacher-student-card.js?v=20260730b" defer></script>
    <script src="./site-meta.js?v=2.02.03" defer></script>
  <nav class="app-bottom-nav" aria-label="주요 메뉴"><a class="nav-button" href="./index.html#home"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10l9-7 9 7v11h-6v-7H9v7H3z"/></svg><b>홈</b></a><a class="nav-button" href="./index.html#curriculum"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 3h16v18H4z M8 7h8 M8 12h8 M8 17h5"/></svg><b>교육과정</b></a><a class="nav-button" href="./index.html#careerHub"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9 9-9 9-9-9z M15 9l-2 4-4 2 2-4z"/></svg><b>진로·진학</b></a><a class="nav-button" href="./index.html#planner"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3h14v18H5z M9 7h6 M9 12h6 M9 17h4"/></svg><b>과목 설계</b></a><a class="nav-button" href="./index.html#selfEvaluation"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l4-1L20 7l-3-3L5 16z M14 7l3 3"/></svg><b>자기평가</b></a></nav>
    <script src="./button-effects.js?v=20261004c" defer></script>
  </body>
</html>
